<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Until Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>
<main class="card">
  <div class="moon">🌙</div>
  <h1>Until Us</h1>
  <p class="subtitle">Every day brings us closer.</p>

  <div id="countdown">
    <div><span id="days">0</span><small>Days</small></div>
    <div><span id="hours">0</span><small>Hours</small></div>
    <div><span id="minutes">0</span><small>Minutes</small></div>
    <div><span id="seconds">0</span><small>Seconds</small></div>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <p id="percent"></p>

  <button id="noteBtn">🤍 Open today's note</button>
  <div id="note" class="note"></div>
</main>
<script src="script.js"></script>
</body>
</html>
